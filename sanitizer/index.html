<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XSS Sanitizer</title>
  </head>
  <body>
    <label for="input">HTML input:</label>
    <textarea id="input"></textarea>
    <br />
    <button id="sanitize">Sanitize</button>
    <button id="analyze-intent" type="button">Analyze intent</button>
    <p id="intent-result" role="status" aria-live="polite"></p>
    <p>Output:</p>
    <textarea readonly id="output"></textarea>
    <p>Rendered:</p>
    <iframe id="rendered" sandbox="" srcdoc=""></iframe>
    <script src="sanitize.js" type="module"></script>
    <script src="index.js" type="module"></script>
  </body>
</html>
